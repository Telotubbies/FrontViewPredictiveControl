name: CI

on:
  push:
    branches: [main, project-ADAS]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check . --select=E,F,W --ignore=E501,E402

  unit-tests:
    name: Unit tests (no CARLA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest>=7.0.0
          pip install pyyaml>=6.0
          pip install numpy scipy opencv-python-headless
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install casadi

      - name: Verify config loads
        run: |
          python -c "import yaml; yaml.safe_load(open('config/default.yaml', encoding='utf-8')); print('config/default.yaml OK')"
          PYTHONPATH=src:. python -c "import config; print('config OK — MPC_DT=', config.MPC_DT)"

      - name: Smoke imports (no CARLA)
        env:
          PYTHONPATH: src:.
        run: |
          python -c "from control.lane_mpc import LaneMPC, MPCConfig; print('control.lane_mpc OK')"
          python -c "from control.pure_pursuit import PurePursuitController; print('control.pure_pursuit OK')"
          python -c "from alg.reference import dynamic_lookahead_m; print('alg.reference OK')"
          python -c "from safety.override import SafetyOverride; print('safety.override OK')"
          python -c "from safety.stuck_recovery import StuckRecovery; print('safety.stuck_recovery OK')"
          python -c "from perception.spline_lane_fitting import BSplineLaneFitter; print('perception.spline_lane_fitting OK')"

      - name: Run unit tests (no CARLA required)
        env:
          PYTHONPATH: src:.
        run: |
          pytest tests/unit/test_lane_mpc.py tests/unit/test_reference.py tests/unit/test_override.py tests/unit/test_stuck_recovery.py tests/unit/test_spline_lane_fitting.py -v --tb=short

      - name: Run config/pipeline tests (may have known failures)
        env:
          PYTHONPATH: src:.
        continue-on-error: true
        run: |
          pytest tests/unit/test_config_only.py tests/unit/test_basic_functionality.py tests/unit/test_pipeline.py -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache/
            **/*.xml
          retention-days: 7

  integration-tests:
    name: Integration tests (require CARLA — skip on CI)
    runs-on: ubuntu-latest
    if: false  # CARLA server not available on GitHub Actions
    steps:
      - uses: actions/checkout@v4
      - run: echo "Integration tests require CARLA server — run locally with CARLA 0.9.16"
