[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frontview-predictive-control"
version = "0.2.0"
description = "CARLA MPC lane-keeping with DSUNet perception and Pure Pursuit fallback"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Telotubbies" }]
keywords = ["carla", "mpc", "lane-keeping", "autonomous-driving", "dsunet", "casadi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "torch>=2.0",
    "casadi>=3.6",
]

# CARLA Python API is NOT on PyPI — install manually from CARLA release wheel.
# See: https://github.com/carla-simulator/carla/releases (UE5 build)
# Install with: pip install carla-0.10.0-cp311-cp311-win_amd64.whl
# Or: pip install -e ".[carla]"  (if you host the wheel on a private index)

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]
gpu = [
    "kornia>=0.6.0",
    "opencv-python>=4.8",
]
# CARLA Python API is NOT on PyPI — install the wheel manually from CARLA releases.
# This extra exists for users who host the wheel on a private index:
#   pip install -e ".[carla]"
carla = [
    "carla>=0.10.0",
]

[project.urls]
Repository = "https://github.com/Telotubbies/FrontViewPredictiveControl"

[project.scripts]
fpvc = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "control*",
    "perception*",
    "safety*",
    "alg*",
    "core*",
    "managers*",
    "gui*",
    "temporal*",
    "bridge*",
    "utils*",
]
exclude = ["tests*", "scripts*", "docs*", "agent*"]

[tool.setuptools.py-modules]
# Standalone modules at src/ root (not packages)
# These are picked up automatically by find since they're in src/

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "integration: requires CARLA server (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module level import not at top (CARLA path setup needs to run first)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "E712"]
"scripts/*" = ["F401"]
"dsunet_training/*" = ["F401", "F541", "W291", "W293"]
"src/gui/*" = ["F401"]
